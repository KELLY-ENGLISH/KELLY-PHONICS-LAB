input{font-family:inherit}
.hidden{display:none!important}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
svg.pic{display:block;width:100%;height:auto}
svg.art{display:block;width:100%;height:auto}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,247,232,.94);backdrop-filter:blur(6px);box-shadow:0 2px 0 rgba(0,0,0,.04)}
.topbar .logo{width:40px;height:40px;flex:none}
.topbar .brand{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-size:18px;box-shadow:var(--shadow);white-space:nowrap}
.pill .ic{width:24px;height:24px}
.iconbtn{display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;border-radius:14px;font-size:17px;padding:6px 10px;min-height:40px;box-shadow:var(--shadow)}
.iconbtn .ic{width:26px;height:26px}
.iconbtn:active,.big:active,.key:active,.opt:active,.mission:active,.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.rankpill{gap:6px}
.rankpill .bar{width:60px;height:8px;background:#eee3cc;border-radius:99px;overflow:hidden}
.rankpill .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange))}

main{max-width:1000px;margin:0 auto;padding:10px 16px 60px}
h1{font-size:40px;margin:14px 0 4px;text-align:center;display:flex;gap:10px;align-items:center;justify-content:center}
h1 .ic{width:52px;height:52px}
h2{font-size:28px;margin:10px 0;display:flex;align-items:center;gap:8px}
h2 .ic{width:36px;height:36px}
.sub{color:var(--muted);text-align:center;font-size:19px;margin:0 0 16px}
.sub .ic{width:24px;height:24px}

/* home & login */
.search-box{max-width:460px;margin:0 auto;background:#fff;border-radius:32px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.08)}
.display{font-size:52px;text-align:center;background:#FFF3C4;border-radius:20px;padding:6px;margin-bottom:14px;min-height:80px;letter-spacing:.15em}
.display .ph{color:#d9c38a;font-size:26px;letter-spacing:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{font-size:32px;padding:12px 0;border-radius:18px;background:#EAF4FF;box-shadow:var(--shadow)}
.key.go{background:var(--green);color:#fff}
.key.del{background:#FFE1E1}
.msg{text-align:center;font-size:19px;min-height:28px;margin-top:10px;color:var(--red)}
.msg .ic{width:24px;height:24px}
.shelf{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
.shelf button{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 16px;font-size:20px;box-shadow:var(--shadow);text-align:left}
.shelf .covers{display:flex;gap:4px}
.shelf .covers svg{width:48px}
.shelf small{display:block;color:var(--muted);font-size:15px}
.tinput{font-size:28px;padding:12px 14px;border-radius:16px;border:3px solid #eadfc6;width:100%;text-align:center;background:#fffdf8}
.tinput:focus{outline:none;border-color:var(--orange)}
.linkrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.linkbtn{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:10px 16px;font-size:17px;box-shadow:var(--shadow);color:var(--muted)}
.linkbtn .ic{width:24px;height:24px}
.notice{display:flex;gap:12px;align-items:flex-start;background:#EAF4FF;border-radius:20px;padding:14px 18px;font-size:18px;line-height:1.5;margin:10px auto 16px;max-width:680px}
.notice .ic{width:34px;height:34px}
.mascot-hi{width:120px;margin:0 auto}

/* set hub */
.booktabs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 16px}
.booktab{border-radius:26px;padding:12px;background:#fff;box-shadow:var(--shadow);text-align:center;font-size:26px;border:5px solid transparent}
.booktab.on{border-color:var(--orange);background:#FFF1DE}
.booktab .cv{width:90px;margin:0 auto 4px}
.booktab .snd{font-size:16px;color:var(--muted);display:flex;gap:4px;justify-content:center;align-items:center}
.booktab .snd .ic{width:20px;height:20px}
.zone{background:#fff;border-radius:28px;padding:16px 18px 22px;box-shadow:0 6px 0 rgba(0,0,0,.06);margin-bottom:18px}
.zone-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.zone-head h2{margin:0;font-size:26px}
.zone-head .cnt{display:flex;align-items:center;gap:6px;font-size:18px;background:#FFF1DE;border-radius:999px;padding:4px 14px}
.zone-head .cnt .ic{width:22px;height:22px}
.zone-head .cnt.all{background:#2ECC71;color:#fff}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;padding-top:14px}
.mission{position:relative;border-radius:24px;padding:16px 10px 14px;color:#fff;font-size:21px;text-align:center;box-shadow:var(--shadow);min-height:150px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mission .mi{width:58px;height:58px;background:rgba(255,255,255,.92);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.mission .mi .ic{width:44px;height:44px}
.mission .num{position:absolute;top:8px;left:10px;background:rgba(255,255,255,.35);border-radius:999px;width:28px;height:28px;line-height:28px;font-size:16px}
.mission small{display:block;font-size:14px;opacity:.95}
.mission .best{font-size:14px;background:rgba(0,0,0,.18);border-radius:99px;padding:1px 10px;margin-top:4px}
.mission.is-done{box-shadow:0 0 0 6px #2ECC71, var(--shadow)}
.mission .donebig{position:absolute;top:-16px;right:-12px;width:62px;height:62px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15));animation:pop .4s}
.mission .donebig .ic{width:62px;height:62px}
.mission .donetag{display:inline-block;margin-top:4px;background:#fff;color:#1f9d55;border-radius:999px;padding:1px 12px;font-size:16px}
.mission.locked{background:#b9b9c6!important;cursor:not-allowed}
.mission.locked .mi{opacity:.55;filter:grayscale(1)}
.mission .lockbig{position:absolute;top:-14px;right:-10px;width:52px;height:52px}
.mission .lockbig .ic{width:52px;height:52px}
.mission .bonus{position:absolute;top:8px;right:10px;background:#FFD43B;color:#7a4b00;border-radius:999px;font-size:13px;padding:2px 8px}
.plan{display:flex;gap:10px;font-size:15px;color:var(--muted);margin-top:4px;line-height:1.6;background:#fff;border-radius:18px;padding:12px 16px}
.plan .ic{width:28px;height:28px}

/* activity */
.act-head{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.act-head h2{flex:1;margin:0;font-size:24px;min-width:0}
.act-head h2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-size:20px;box-shadow:var(--shadow);position:relative}
.hud .ic{width:24px;height:24px}
.hud .streak{display:flex;align-items:center;gap:2px;color:#E8590C;font-size:17px}
.floatpts{position:absolute;right:8px;top:-6px;color:#2FB36B;font-size:24px;font-weight:800;animation:floatup .9s forwards;pointer-events:none}
.floatpts.neg{color:var(--red)}
@keyframes floatup{to{transform:translateY(-36px);opacity:0}}
.progress{position:relative;height:18px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.08);margin-bottom:14px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));width:0;transition:width .4s}
.progress>span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:18px;color:#7a5a20}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:22px;padding:12px 20px;border-radius:20px;background:var(--blue);color:#fff;box-shadow:var(--shadow)}
.big .ic{width:28px;height:28px}
.big.alt{background:#fff;color:var(--ink)}
.big.green{background:var(--green)}
.big.pink{background:var(--pink)}
.big.purple{background:var(--purple)}
.big:disabled{opacity:.35}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.vowel{color:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}

/* mascot cheer */
.cheerbox{position:fixed;left:14px;bottom:14px;z-index:40;display:flex;align-items:flex-end;gap:6px;pointer-events:none;animation:slidein .25s}
.cheerbox .face{width:84px}
.cheerbox .say{background:#fff;border-radius:18px;padding:8px 14px;font-size:20px;box-shadow:var(--shadow);margin-bottom:40px}
@keyframes slidein{from{transform:translateY(120px)}}

/* flashcard */
.flash{perspective:1200px;max-width:520px;margin:0 auto}
.flash-inner{position:relative;height:400px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:34px;background:#fff;box-shadow:0 10px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:10px}
.face.back{transform:rotateY(180deg);background:#FFF3C4}
.face .pv{width:200px}
.face .word{font-size:76px;line-height:1.1}
.face .word span{display:inline-block;transition:transform .2s}
.face .word span.lit{transform:translateY(-14px) scale(1.3);color:var(--blue)}
.face .ko{font-size:52px}
.face .hint{font-size:15px;color:var(--muted);margin-top:4px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:#e5dccb}
.dots i.seen{background:var(--orange)}
.dots i.cur{outline:4px solid var(--blue)}

/* options */
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:640px;margin:0 auto}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{background:#fff;border-radius:26px;padding:12px;font-size:38px;box-shadow:var(--shadow);border:5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt .pv{width:120px}
.opt.right{border-color:var(--green);background:#E3FFF0}
.opt.wrong{opacity:.35}
.speaker{display:flex;align-items:center;justify-content:center;margin:0 auto 16px;background:var(--yellow);border-radius:50%;width:116px;height:116px;box-shadow:var(--shadow)}
.speaker .ic{width:64px;height:64px}
.qsent{font-size:44px;text-align:center;margin:10px 0}

/* spell & build */
.spell-top{text-align:center}
.spell-top .pv{width:170px;margin:0 auto}
.spell-top .ko{font-size:28px;color:var(--muted)}
.slots{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.slot{min-width:64px;height:78px;padding:0 8px;border-radius:16px;background:#fff;border:4px dashed #d8cdb5;font-size:46px;display:flex;align-items:center;justify-content:center}
.slot.fill{border-style:solid;border-color:var(--green)}
.slot.space{border:none;background:none;min-width:20px}
.slots.words .slot{font-size:34px;min-width:80px;height:66px}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:680px;margin:0 auto}
.tile{min-width:72px;height:72px;padding:0 14px;border-radius:18px;background:var(--orange);color:#fff;font-size:42px;box-shadow:var(--shadow)}
.tiles.words .tile{font-size:32px;height:62px;background:var(--purple)}
.tile.used{visibility:hidden}
.build-art{max-width:420px;margin:0 auto}
.build-ko{text-align:center;font-size:24px;color:#6b5a2e;background:#FFF3C4;border-radius:16px;padding:8px 12px;max-width:520px;margin:10px auto}

/* balloon */
.speedpick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:620px;margin:20px auto}
.speedpick button{background:#fff;border-radius:26px;padding:18px 8px;font-size:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.speedpick .ic{width:64px;height:64px}
.speedpick small{font-size:14px;color:var(--muted)}
.sky{position:relative;height:520px;border-radius:30px;overflow:hidden;background:linear-gradient(#BDE6FF,#E8F7FF);box-shadow:inset 0 0 0 4px #fff}
.balloon{position:absolute;bottom:-200px;width:140px;height:172px;border-radius:50% 50% 48% 48%;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset -12px -14px 0 rgba(0,0,0,.12);animation:rise linear forwards}
.balloon .pv{width:62px;background:rgba(255,255,255,.85);border-radius:50%}
.balloon::after{content:"";position:absolute;bottom:-60px;left:50%;width:2px;height:60px;background:#888}
.balloon.boom{animation:boom .3s forwards!important}
@keyframes rise{to{transform:translateY(-780px)}}
@keyframes boom{to{transform:scale(1.8);opacity:0}}

/* reader */
.page{background:#fff;border-radius:30px;padding:18px;box-shadow:0 10px 0 rgba(0,0,0,.08);text-align:center}
.page .art{max-width:600px;margin:4px auto 8px;border-radius:22px}
.pgno{font-size:16px;color:#9a8f7a;display:flex;gap:6px;justify-content:center;align-items:center}
.pgno .ic{width:20px;height:20px}
.sent{font-size:44px;line-height:1.5;margin:6px 0}
.sent .w{display:inline-block;padding:0 6px;border-radius:12px;cursor:pointer}
.sent .w.vocab{border-bottom:5px dotted var(--orange)}
.sent .w.hl{background:var(--yellow)}
.trans{font-size:26px;color:#6b5a2e;background:#FFF3C4;border-radius:18px;padding:10px;margin-top:8px}
.tip{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:20px;padding:12px 22px;font-size:24px;z-index:60;display:flex;align-items:center;gap:8px;max-width:92vw}
.tip .ic{width:28px;height:28px}
.rec{background:var(--red)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* celebrate */
.overlay{position:fixed;inset:0;background:rgba(43,43,58,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.cheer{background:#fff;border-radius:36px;padding:24px 30px;text-align:center;max-width:440px;width:100%;animation:pop .5s}
.cheer .tro{width:110px;margin:0 auto}
.cheer .tro .ic{width:110px;height:110px}
.cheer h2{font-size:30px;justify-content:center}
.cheer .pts{font-size:46px;color:#E8590C}
.cheer .tot{font-size:18px;color:var(--muted)}
.cheer .rank{display:flex;align-items:center;gap:8px;justify-content:center;margin:10px 0 16px;font-size:18px}
.cheer .rank .ic{width:34px;height:34px}
.cheer .rbar{height:14px;background:#eee3cc;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.cheer .rbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width 1s}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}

/* teacher */
.panel{background:#fff;border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.06);margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:22px;display:flex;align-items:center;gap:8px}
.panel h3 .ic{width:28px;height:28px}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{background:#FFF1DE;text-align:left;padding:8px;position:sticky;top:0;white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid #f0e8d8;vertical-align:top}
.tbl td:first-child,.tbl td:nth-child(2){white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FFFBF2}
.tblwrap{overflow:auto;max-height:520px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:#FFE1E1;border-radius:999px;padding:4px 12px;font-size:16px}
.grid-prog{border-collapse:collapse;font-size:15px}
.grid-prog td,.grid-prog th{border:1px solid #f0e8d8;padding:6px 8px;text-align:center}
.grid-prog .ic{width:22px;height:22px}
.score-hi{color:#1d7a4b} .score-lo{color:#d63c3c}
.trow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.trow select,.trow input{font-size:17px;padding:8px 10px;border-radius:12px;border:2px solid #eadfc6}

/* ===== 핸드폰 ===== */
@media (max-width:640px){
  .topbar{padding:6px 8px;gap:5px}
  .topbar .logo{width:34px;height:34px}
  .topbar .brand{font-size:15px}
  .pill{padding:5px 8px;font-size:15px}
  .pill .ic{width:20px;height:20px}
  .rankpill .bar{display:none}
  .rankpill .rname{display:none}
  .iconbtn{min-height:34px;padding:4px 7px}
  .iconbtn .ic{width:22px;height:22px}
  .iconbtn .lbl{display:none}
  main{padding:8px 10px 50px}
  h1{font-size:26px} h1 .ic{width:36px;height:36px}
  h2{font-size:22px}
  .sub{font-size:16px}
  .search-box{padding:14px;border-radius:24px}
  .display{font-size:40px;min-height:64px}
  .key{font-size:26px;padding:10px 0}
  .tinput{font-size:22px}
  .booktabs{gap:8px}
  .booktab{font-size:18px;padding:8px;border-width:4px;border-radius:20px}
  .booktab .cv{width:58px}
  .booktab .snd{font-size:12px}
  .zone{padding:12px 10px 16px;border-radius:22px}
  .zone-head h2{font-size:20px}
  .zone-head .cnt{font-size:15px;padding:3px 10px}
  .missions{grid-template-columns:repeat(2,1fr);gap:14px}
  .mission{font-size:17px;min-height:128px;padding:12px 6px 10px}
  .mission .mi{width:48px;height:48px} .mission .mi .ic{width:36px;height:36px}
  .mission small{font-size:12px}
  .mission .donebig,.mission .donebig .ic{width:48px;height:48px}
  .mission .lockbig,.mission .lockbig .ic{width:42px;height:42px}
  .plan{font-size:13px}
  .act-head h2{font-size:18px}
  .hud{font-size:16px;padding:4px 10px}
  .flash-inner{height:330px}
  .face .pv{width:150px}
  .face .word{font-size:56px}
  .face .ko{font-size:40px}
  .big{font-size:17px;padding:10px 13px;border-radius:16px}
  .big .ic{width:22px;height:22px}
  .opts{gap:10px}
  .opt{font-size:28px;padding:8px;border-radius:20px}
  .opt .pv{width:92px}
  .speaker{width:92px;height:92px} .speaker .ic{width:50px;height:50px}
  .qsent{font-size:34px}
  .slot{min-width:48px;height:62px;font-size:36px}
  .slots.words .slot{font-size:24px;min-width:56px;height:52px}
  .tile{min-width:58px;height:58px;font-size:32px}
  .tiles.words .tile{font-size:24px;height:50px}
  .sky{height:440px}
  .balloon{width:96px;height:120px;font-size:20px}
  .balloon .pv{width:44px}
  .speedpick{gap:8px} .speedpick button{font-size:18px;padding:12px 4px} .speedpick .ic{width:46px;height:46px}
  .page{padding:10px;border-radius:22px}
  .sent{font-size:28px}
  .trans{font-size:19px}
  .tip{font-size:18px}
  .cheerbox .face{width:60px} .cheerbox .say{font-size:16px;margin-bottom:28px}
  .cheer{padding:18px}
  .cheer h2{font-size:22px} .cheer .pts{font-size:36px}
}

/* ===== 큰 점수 반응 ===== */
.bigpts{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:96px;color:#2FB36B;-webkit-text-stroke:4px #fff;paint-order:stroke;text-shadow:0 6px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;animation:bigpop 1.2s forwards}
.bigpts.neg{color:#F03E3E}
.bigpts small{font-family:'Jua',sans-serif;font-size:38px;color:#E8590C;-webkit-text-stroke:0;background:#fff;border-radius:999px;padding:4px 18px;margin-top:4px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.bigpts small .ic{width:40px;height:40px}
@keyframes bigpop{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-110%) scale(.9);opacity:0}}
.hud.bump{animation:hudbump .45s}
@keyframes hudbump{40%{transform:scale(1.35)}}

/* ===== 힌트 ===== */
.hintwrap{position:relative}
.hintline{position:absolute;left:0;right:0;top:-6px;text-align:center;font-size:40px;color:#9B6BFF;opacity:0;pointer-events:none;transition:opacity .25s;
  background:rgba(255,255,255,.92);border-radius:16px;padding:4px 10px;width:max-content;max-width:96%;margin:0 auto;z-index:3;box-shadow:0 0 0 3px #E5DBFF}
.hintline.show{opacity:.92}

/* ===== 풍선 터뜨리기 ===== */
.bgtop{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:10px}
.speaker.small{width:84px;height:84px;margin:0}
.speaker.small .ic{width:46px;height:46px}
.hearts{display:flex;gap:6px}
.hearts .hrt{width:44px;height:40px;transition:transform .3s}
.hearts .hrt.off{transform:scale(.8)}
.sky2{position:relative;height:540px;border-radius:30px;overflow:hidden;box-shadow:inset 0 0 0 4px #fff,0 8px 0 rgba(0,0,0,.08)}
.skybg{position:absolute;inset:0;width:100%;height:100%}
.cloud{position:absolute;left:-180px;animation:drift linear infinite}
.cloud svg{width:100%;height:auto}
@keyframes drift{to{transform:translateX(calc(100vw + 360px))}}
.bird{position:absolute;left:-40px;width:34px;animation:drift linear infinite}
.combo{position:absolute;right:12px;top:16%;width:22px;height:46%;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;z-index:2}
.combo .fill{width:100%;height:0;background:linear-gradient(0deg,#FF922B,#FFD43B);transition:height .4s}
.combo span{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%)}
.combo span .ic{width:26px;height:26px}
.field{position:absolute;inset:0}
.bwrap{position:absolute;bottom:-230px;display:flex;flex-direction:column;align-items:center;animation:rise linear forwards}
.balloon2{width:132px;height:162px;transform:scale(var(--sc));border-radius:50% 50% 47% 47%;position:relative;
  background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.75) 0 9%,transparent 10%),radial-gradient(circle at 50% 45%,transparent 55%,rgba(0,0,0,.18) 100%),var(--c);
  box-shadow:inset -10px -14px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-size:26px;
  animation:sway ease-in-out infinite alternate;transform-origin:50% 100%}
.balloon2::after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top:10px solid var(--c);border-bottom:0}
.balloon2 .pvb{width:62px;background:rgba(255,255,255,.88);border-radius:50%;padding:2px}
.balloon2 b{text-shadow:0 2px 0 rgba(0,0,0,.25)}
.balloon2.gold{--c:#F5B700;box-shadow:inset -10px -14px 0 rgba(0,0,0,.1),0 0 24px 6px rgba(255,212,59,.8)}
.balloon2 .gsp{position:absolute;top:6px;right:8px} .balloon2 .gsp .ic{width:28px;height:28px;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.balloon2.bad{opacity:.35;filter:grayscale(1)}
.bstr{display:block;width:2px;height:70px;background:#8a8a8a;margin-top:8px}
@keyframes sway{from{transform:scale(var(--sc)) rotate(-7deg) translateX(-6px)}to{transform:scale(var(--sc)) rotate(7deg) translateX(6px)}}
@keyframes rise{to{transform:translateY(-820px)}}
.spark{position:absolute;width:14px;height:14px;border-radius:4px;animation:spark .7s forwards;pointer-events:none}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.poptxt{position:absolute;transform:translate(-50%,-50%);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#FF6B9A;-webkit-text-stroke:3px #fff;paint-order:stroke;animation:poptxt .7s forwards;pointer-events:none}
@keyframes poptxt{0%{transform:translate(-50%,-50%) scale(.4)}40%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.fallpic{position:absolute;width:68px;animation:fallpic 1.3s ease-in forwards;pointer-events:none}
@keyframes fallpic{60%{opacity:1}to{transform:translateY(420px) rotate(160deg);opacity:0}}
.bcat{position:absolute;left:50%;bottom:6px;width:96px;transform:translateX(-50%);z-index:2;pointer-events:none}
.bcat.jump{animation:catjump .8s}
.bcat.shock{animation:shake .4s 2}
@keyframes catjump{0%,100%{transform:translateX(-50%)}40%{transform:translate(-50%,-70px) rotate(-8deg)}70%{transform:translate(-50%,-20px)}}
.bover{position:absolute;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:5}
.bobox{background:#fff;border-radius:28px;padding:20px 24px;box-shadow:0 10px 0 rgba(0,0,0,.1);text-align:center}
@media (max-width:640px){
  .bigpts{font-size:70px} .bigpts small{font-size:26px} .bigpts small .ic{width:28px;height:28px}
  .hintline{font-size:28px}
  .sky2{height:460px}
  .balloon2{width:86px;height:108px;font-size:17px}
  .balloon2 .pvb{width:42px}
  .bstr{height:50px}
  .bcat{width:70px}
  .hearts .hrt{width:34px;height:30px}
  .speaker.small{width:68px;height:68px} .speaker.small .ic{width:38px;height:38px}
}

</style>
</head>

  /* ---------- 표정 ---------- */
  function eyes(mood, lx, rx, y, s=1){

    const sq=(x,dir)=>`<path d="M${x-8*dir*s} ${y-9*s} L${x+8*dir*s} ${y} L${x-8*dir*s} ${y+9*s}" stroke="${O}" stroke-width="${5.5*s}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

  /* 고양이 (전신) : (0,0)=발밑 가운데 */
  function cat(o={}){

/* 🔤 글자별 소리 (글자씩 듣기, 소리 합치기). 한국어 음성으로 소리 내요. */
const LETTER_SOUNDS = {
  a:"애", b:"브", c:"크", d:"드", e:"에", f:"프", g:"그", h:"흐", i:"이", j:"쥬", k:"크", l:"르", m:"므",
  n:"느", o:"어", p:"프", q:"크", r:"르", s:"스", t:"트", u:"어", v:"브", w:"우", x:"크스", y:"이", z:"즈"
};

/* 연속자음·이중자음은 한 덩어리로 소리 내요 (글자씩 듣기) */
const CHUNK_SOUNDS={sh:"쉬",ch:"취",th:"쓰",ck:"크",ng:"응",bl:"블",cl:"클",fl:"플",gl:"글",pl:"플",sl:"슬",br:"브르",cr:"크르",dr:"드르",fr:"프르",gr:"그르",pr:"프르",tr:"트르",
  sk:"스크",sm:"스므",sn:"스느",sp:"스프",st:"스트",sw:"스우",nd:"는드",nt:"는트",mp:"음프"};
const START_BLENDS=/^(bl|cl|fl|gl|pl|sl|br|cr|dr|fr|gr|pr|tr|sk|sm|sn|sp|st|sw)/, END_BLENDS=/(st|nd|nt|mp|sk)$/, DIGRAPHS=["sh","ch","th","ck","ng"];
/* 단어 → 소리 덩어리 [{s:시작글자번호, n:글자수, snd:소리}] (띄어쓰기 제외한 글자 순서 기준) */
function soundChunks(en){
  const out=[]; let base=0;
  en.toLowerCase().split(/\s+/).forEach(word=>{
    let i=0; const m1=word.match(START_BLENDS), m2=word.match(END_BLENDS), endAt= m2 && word.length>2 ? word.length-2 : -1;
    while(i<word.length){
      let len=1;
      if(i===0&&m1&&word.length>2) len=2;
      else if(i===endAt) len=2;
      else if(DIGRAPHS.includes(word.slice(i,i+2))) len=2;
      const piece=word.slice(i,i+len);
      out.push({s:base+i,n:len,snd: len>1? (CHUNK_SOUNDS[piece]||piece) : (LETTER_SOUNDS[piece]||piece)});
      i+=len;
    }
    base+=word.length;
  });
  return out;
}

function vq(v){ let q=0; const n=v.name; if(/natural|neural|online/i.test(n)) q+=100; if(/premium|enhanced|siri/i.test(n)) q+=80; if(/google/i.test(n)) q+=50;
  if(v.lang==="en-US") q+=30; else if(/^en-(GB|AU|CA)/.test(v.lang)) q+=12; if(/novelty|bells|bubbles|whisper|zarvox|trinoids|bad news|boing|cellos|organ|jester|superstar|wobble|albert|bahh/i.test(n)) q-=500; return q; }
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  const en=vs.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vq(b)-vq(a));
  const byName=n=>vs.find(v=>v.name===n);
  // 선생님이 고른 목소리 (크롬): 여자 Google US English / 남자 Google UK English Male / 한국어 Google 한국의
  enF = byName(PREFERRED.female) || en.find(v=>FEMALE.test(v.name)&&!MALE.test(v.name)) || en.find(v=>!MALE.test(v.name)) || en[0] || null;
  enM = byName(PREFERRED.male) || en.find(v=>MALE.test(v.name)&&!/female/i.test(v.name)) || null;
  const ko=vs.filter(v=>/^ko/i.test(v.lang)).sort((a,b)=>{ const s=v=>(/natural|neural|online/i.test(v.name)?100:0)+(/premium|enhanced|siri|yuna|sora|heami|sunhi|injoon/i.test(v.name)?60:0)+(/google/i.test(v.name)?40:0); return s(b)-s(a); });
  koVoice = byName(PREFERRED.ko) || ko[0] || null;
}

function speak(text,opt={}){
  if(!soundOn||!("speechSynthesis" in window)){ opt.onend&&later(opt.onend,600); return; }

  if(!ko) text=sayText(text); else text=String(text).replace(/[~〜∼]/g,"").trim();   // 한국어: 물결표(~)는 읽지 않아요
  const u=new SpeechSynthesisUtterance(text);
  u.lang= ko ? "ko-KR" : "en-US";
  if(ko){ if(koVoice) u.voice=koVoice; u.rate=opt.rate||1; u.pitch=1; }
  else{
    const male=VOICE_PREF==="male";
    const v= male ? (enM||enF) : enF; if(v){ u.voice=v; u.lang=v.lang; }
    u.rate=opt.rate||.85; u.pitch= male ? (enM?1:.62) : 1.05;
  }

  if(opt.onboundary) u.onboundary=opt.onboundary;

      else if(res.error==="wrong pw"){ pwEl.value=""; fail("비밀번호가 틀렸어요. 다시 해 봐요!"); }
      else if(res.error==="unknown action") fail(`${ICON("warn")} 선생님: 구글 시트 코드가 예전 버전이에요.`);
      else fail(`${ICON("warn")} 시트 오류 — ${esc(res.error||"알 수 없음")}`);
    }catch(e){ fail(`${ICON("wifi")} 시트에 연결하지 못했어요. 인터넷을 확인해 주세요.`); }
    busy=false;
  };
  lb.querySelector("#lgo").onclick=go;
  idEl.onkeydown=e=>{ if(e.key==="Enter") pwEl.focus(); };
  pwEl.onkeydown=e=>{ if(e.key==="Enter") go(); };
}

function openSet(id,bookIdx){
  clearTimers(); speechSynthesis.cancel(); stopMic();
  curSetId=id; if(bookIdx!==undefined) curBook=bookIdx;
  const set=BOOK_SETS[id]; if(curBook>=set.books.length) curBook=0;
  document.getElementById("brand").textContent=`K${id} · ${set.series}`;
  app.innerHTML="";
  const el=$(`<section><div class="booktabs" id="tabs"></div>
    <div class="zone"><div class="zone-head"><h2>${ICON("school")} 학원에서 해요</h2><span class="cnt" id="cc"></span></div><div class="missions" id="msC"></div></div>
    <div class="zone"><div class="zone-head"><h2>${ICON("home")} 숙제</h2><span class="cnt" id="hc"></span></div><div class="missions" id="msH"></div></div>
    <div class="plan">${ICON("clock")}<div><b>90분 수업 순서</b> : 1권 (단어 듣기 → 듣고 고르기 → 풍선 → TEST) → 쉬는 시간 → 2권 (같은 순서)<br>
      TEST는 ①②③을 끝내야 열려요 · 책 읽기와 문장 블록은 자유롭게 · 숙제는 집에서 해요</div></div></section>`);
  app.appendChild(el);
  const tabs=el.querySelector("#tabs");
  set.books.forEach((b,i)=>{ const n=MISSIONS.filter(m=>SAVE.done[`${id}-${i}-${m.id}`]).length;
    const t=$(`<button class="booktab ${i===curBook?'on':''}"><div class="cv">${PIC(b.cover)}</div><span class="en">${b.title}</span><div class="snd">${b.soundName} · ${ICON("check")} ${n}/${MISSIONS.length}</div></button>`);
    t.onclick=()=>{ openSet(id,i); speak(b.title); }; tabs.appendChild(t); });
  const isDone=m=>!!SAVE.done[`${id}-${curBook}-${m.id}`];
  const cls=MISSIONS.filter(m=>m.group==="class"), home=MISSIONS.filter(m=>m.group==="home");
  const left=cls.filter(m=>m.req&&!isDone(m));
  const card=(m,i,box)=>{
    const done=isDone(m), locked=m.test&&left.length>0&&!done, best=SAVE.best[`${id}-${curBook}-${m.id}`];
    const b=$(`<button class="mission ${done?'is-done':''} ${locked?'locked':''}" style="background:${m.color}"><span class="num">${i+1}</span>
      ${done?`<span class="donebig">${ICON("check")}</span>`:''}${locked?`<span class="lockbig">${ICON("lock")}</span>`:''}
      <span class="mi">${ICON(m.ic)}</span>${m.name}<small>${locked?`①②③을 끝내면 TEST가 열려요`:m.desc}</small>${done?`<span class="donetag">완료!</span>`:''}${best?`<span class="best">최고 ${best}점</span>`:''}</button>`);
    b.onclick=()=>{ if(locked){ beep("bad"); tip(`${ICON("lock")} 먼저 끝내요: ${left.map(x=>x.name).join(", ")}`); speak("먼저 앞의 공부를 끝내요",{lang:"ko"}); b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400); return; } startMission(m.id); };
    box.appendChild(b);
  };
  cls.forEach((m,i)=>card(m,i,el.querySelector("#msC")));
  home.forEach((m,i)=>card(m,i,el.querySelector("#msH")));
  const cc=el.querySelector("#cc"), hc=el.querySelector("#hc");
  const need=cls, cDone=need.filter(isDone).length, hDone=home.filter(isDone).length;
  cc.innerHTML= cDone===need.length?`${ICON("trophy")} 모두 완료!`:`${ICON("check")} ${cDone} / ${need.length}`; if(cDone===need.length) cc.classList.add("all");
  hc.innerHTML= hDone===home.length?`${ICON("trophy")} 숙제 끝!`:`${ICON("check")} ${hDone} / ${home.length}`; if(hDone===home.length) hc.classList.add("all");
}

/* ---------- 활동 화면 틀 ---------- */
let MIC=null;
function stopMic(){ try{ if(MIC) MIC.getTracks().forEach(t=>t.stop()); }catch(e){} MIC=null; }
let CUR={start:Date.now(),wrong:new Set()};
function noteWrong(w){ CUR.wrong.add(w); }
function frame(title,icon){
  clearTimers(); speechSynthesis.cancel(); stopMic();
  CUR={start:Date.now(),wrong:new Set()}; GAME={pts:0,streak:0,hud:null};
  app.innerHTML="";
  const el=$(`<section><div class="act-head"><button class="iconbtn" id="back">${ICON("left")}<span class="lbl">미션</span></button><h2>${ICON(icon)}<span>${esc(title)}</span></h2><div class="hud" id="hud"></div></div>
    <div class="progress"><div></div><span></span></div><div class="body"></div></section>`);
  el.querySelector("#back").onclick=()=>openSet(curSetId);
  app.appendChild(el);
  GAME.hud=el.querySelector("#hud"); hudDraw();
  return {body:el.querySelector(".body"), setProg:(r,label)=>{ el.querySelector(".progress>div").style.width=(r*100)+"%"; el.querySelector(".progress>span").textContent=label||""; }};
}
function book(){ return BOOK_SETS[curSetId].books[curBook]; }
function bookWords(){ const b=book(); return b.words.map(w=>Object.assign({vowel:b.vowel},w)); }
function finish(key,title,pts,score=null,total=null){
  SAVE.done[key]=true;
  const prev=SAVE.best[key]||0, improved=pts>prev; if(improved) SAVE.best[key]=pts; persist(); refreshTop();
  const [setId,bk,mission]=key.split("-"), set=BOOK_SETS[setId];
  sendRecord({time:new Date().toISOString(),setId,key,mission,missionName:MISSION_NAMES[mission]||mission,book:String(Number(bk)+1),bookTitle:set.books[Number(bk)].title,
    score,total,stars:pts,seconds:Math.round((Date.now()-CUR.start)/1000),wrong:[...CUR.wrong]});
  celebrate(title,pts,()=>openSet(curSetId),improved);
}
function startMission(id){
  const k=`${curSetId}-${curBook}-${id}`, m=MISSIONS.find(x=>x.id===id), t=`${m.name} · ${book().title}`;
  ({flash:()=>gFlash(t,k,m.ic), listen:()=>gListen(t,k,m.ic), balloon:()=>gBalloonPick(t,k,m.ic), quiz:()=>gQuiz(t,k,m.ic), read:()=>gRead(t,k,m.ic),
    recread:()=>gRecord(t,k,m.ic), spell:()=>gSpell(t,k,m.ic), build:()=>gBuild(t,k,m.ic)})[id]();
}

/* =========================================================
   ① 단어 듣기
   ========================================================= */
function gFlash(title,key,ic){
  const {body,setProg}=frame(title,ic);
  const ws=bookWords(); let i=0; const seen=new Set(); let run=0;
  body.innerHTML=`<div class="flash" id="fc"><div class="flash-inner">
      <div class="face front"><div class="pv"></div><div class="word en"></div><div class="hint">카드를 누르면 뜻이 나와요</div></div>
      <div class="face back"><div class="pv"></div><div class="ko"></div><div class="hint"></div></div></div></div>
    <div class="dots" id="dots"></div>
    <div class="btnrow"><button class="big alt" id="prev">${ICON("left")}</button><button class="big" id="say">${ICON("speaker")} 듣기</button>
      <button class="big pink" id="slow">${ICON("turtle")} 천천히</button><button class="big green" id="split">${ICON("letters")} 글자씩</button><button class="big alt" id="next">${ICON("right")}</button></div>
    <p class="sub">${ICON("mic")} 듣고 큰 소리로 3번 따라 말해 보세요!</p>`;
  const fc=body.querySelector("#fc"), dots=body.querySelector("#dots");
  ws.forEach(()=>dots.appendChild(document.createElement("i")));
  function show(){
    const w=ws[i]; run++; fc.classList.remove("flipped");
    if(!seen.has(i)){ seen.add(i); addPts(5,"",true); }
    fc.querySelector(".front .pv").innerHTML=PIC(w.en); fc.querySelector(".back .pv").innerHTML=PIC(w.en);
    fc.querySelector(".front .word").innerHTML=colorWord(w,w.vowel);
    fc.querySelector(".back .ko").textContent=w.ko; fc.querySelector(".back .hint").textContent=w.note||"";
    [...dots.children].forEach((d,j)=>{ d.className=(seen.has(j)?"seen ":"")+(j===i?"cur":""); });
    setProg(seen.size/ws.length,`${seen.size} / ${ws.length}`);
    later(()=>speak(w.en),250);
    if(seen.size===ws.length&&!show.done){ show.done=true; later(()=>finish(key,"단어를 다 들었어요!",GAME.pts,ws.length,ws.length),2600); }
  }
  fc.onclick=()=>{ fc.classList.toggle("flipped"); const w=ws[i]; fc.classList.contains("flipped")? speak(w.ko,{lang:"ko"}) : speak(w.en); };
  body.querySelector("#prev").onclick=()=>{ i=(i-1+ws.length)%ws.length; show(); };
  body.querySelector("#next").onclick=()=>{ i=(i+1)%ws.length; show(); };
  body.querySelector("#say").onclick=()=>speak(ws[i].en);
  body.querySelector("#slow").onclick=()=>speak(ws[i].en,{rate:.5});
  body.querySelector("#split").onclick=()=>{
    fc.classList.remove("flipped"); clearTimers(); speechSynthesis.cancel();
    const spans=[...fc.querySelectorAll(".front .word span")].filter(sp=>/[a-z]/i.test(sp.textContent));
    const chunks=soundChunks(ws[i].en);
    let k=0; const myRun=++run;
    const lit=j=>{ spans.forEach(x=>x.classList.remove("lit")); if(j>=0){ const c=chunks[j]; for(let q=c.s;q<c.s+c.n;q++) spans[q]&&spans[q].classList.add("lit"); } };
    const step=()=>{ if(myRun!==run) return;
      if(k<chunks.length){ const j=k++; lit(j); let moved=false; const go=()=>{ if(moved||myRun!==run) return; moved=true; later(step,250); };
        speak(chunks[j].snd,{lang:"ko",rate:.9,onend:go}); later(go,1300); }
      else later(()=>{ lit(-1); speak(ws[i].en,{rate:.6}); },200); };
    step();
  };
  show();
}

/* =========================================================
   ② 듣고 고르기
   ========================================================= */
function gListen(title,key,ic){
  const {body,setProg}=frame(title,ic);
  const pool=bookWords(), targets=pick(pool,8); let r=0, score=0;
  function round(){
    if(r>=targets.length) return finish(key,`${targets.length}문제 중 ${score}개 한 번에!`,GAME.pts,score,targets.length);
    setProg(r/targets.length,`남은 문제 ${targets.length-r}`);
    const t=targets[r]; let tries=0;
    const opts=shuffle([t,...pick(pool.filter(w=>w.en!==t.en),3)]);
    body.innerHTML=`<button class="speaker">${ICON("speaker")}</button><p class="sub">잘 듣고 맞는 그림을 눌러요!</p><div class="opts"></div>`;
    body.querySelector(".speaker").onclick=()=>speak(t.en);
    const box=body.querySelector(".opts");
    opts.forEach(o=>{ const b=$(`<button class="opt">${pv(o)}<span class="en">${colorWord(o,o.vowel)}</span></button>`);
      b.onclick=()=>{ if(b.classList.contains("wrong")||box.dataset.lock) return;
        if(o.en===t.en){ box.dataset.lock=1; b.classList.add("right","pop"); if(!tries) score++; right(!tries); speak(t.en); r++; later(round,1100); }
        else { tries++; b.classList.add("wrong","shake"); wrong(t.en); later(()=>speak(t.en),300); } };
      box.appendChild(b); });
    later(()=>speak(t.en),400);
  }
  round();
}

/* =========================================================
   ③ 풍선 터뜨리기 (속도 3단계)
   ========================================================= */
const SPEEDS={slow:{name:"느리게",ic:"turtle",base:8.5,ramp:3,min:.3},normal:{name:"보통",ic:"rabbit",base:5,ramp:3,min:.3},fast:{name:"빠르게",ic:"rocket",base:3.2,ramp:1.6,min:.16}};
function gBalloonPick(title,key,ic){
  const {body,setProg}=frame(title,ic); setProg(0,"속도를 골라요");
  body.innerHTML=`<p class="sub" style="font-size:22px">어떤 속도로 할까요?</p><div class="speedpick">${Object.entries(SPEEDS).map(([k,v])=>`<button data-k="${k}">${ICON(v.ic)}${v.name}<small>${k==="fast"?"점수 +5 보너스":k==="slow"?"천천히 연습":"기본 속도"}</small></button>`).join("")}</div>`;
  body.querySelectorAll(".speedpick button").forEach(b=>b.onclick=()=>gBalloon(title,key,ic,b.dataset.k));
}
function gBalloon(title,key,ic,speedKey){
  const {body,setProg}=frame(title,ic); const sp=SPEEDS[speedKey];
  const pool=bookWords(), targets=pick(pool,8); let r=0, score=0, lives=3, over=false;
  const colors=["#FF6B9A","#4DA3FF","#38C47E","#FF9F43","#9B6BFF","#00B8D9"];
  const cloud=`<svg viewBox="0 0 120 60"><ellipse cx="40" cy="38" rx="34" ry="18" fill="#fff"/><ellipse cx="70" cy="30" rx="30" ry="22" fill="#fff"/><ellipse cx="92" cy="40" rx="24" ry="15" fill="#fff"/></svg>`;
  const bird=`<svg viewBox="0 0 40 20"><path d="M2 12 q9 -10 18 0 q9 -10 18 0" stroke="#4B5563" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
  body.innerHTML=`<div class="bgtop"><button class="speaker small" id="sp">${ICON("speaker")}</button><div class="hearts" id="hearts"></div></div>
    <div class="sky2">
      <svg class="skybg" viewBox="0 0 800 540" preserveAspectRatio="xMidYMid slice"><rect width="800" height="540" fill="url(#gSky)"/>
        <circle cx="690" cy="90" r="80" fill="url(#gGlow)"/><circle cx="690" cy="90" r="44" fill="url(#gSun)"/>
        <path d="M0 450 Q160 390 330 430 T620 420 T800 440 V540 H0Z" fill="url(#gHillBack)"/><path d="M0 500 Q200 460 420 490 T800 486 V540 H0Z" fill="url(#gHill)"/>
        <g><circle cx="120" cy="520" r="7" fill="#FF8FB1"/><circle cx="120" cy="520" r="3" fill="#FFE066"/><circle cx="560" cy="516" r="7" fill="#fff"/><circle cx="560" cy="516" r="3" fill="#FFD43B"/><circle cx="720" cy="522" r="7" fill="#B197FC"/><circle cx="720" cy="522" r="3" fill="#FFE066"/></g></svg>
      <div class="cloud" style="top:8%;animation-duration:38s;animation-delay:-6s;width:150px">${cloud}</div>
      <div class="cloud" style="top:24%;animation-duration:52s;animation-delay:-30s;width:110px;opacity:.85">${cloud}</div>
      <div class="cloud" style="top:40%;animation-duration:46s;animation-delay:-18s;width:90px;opacity:.7">${cloud}</div>
      <div class="bird" style="top:14%;animation-duration:22s">${bird}</div><div class="bird" style="top:20%;animation-duration:26s;animation-delay:-9s;width:26px">${bird}</div>
      <div class="combo" id="combo"><div class="fill" id="cfill"></div><span>${ICON("fire")}</span></div>
      <div class="field" id="field"></div>
      <div class="bcat" id="bcat">${PIC("mascot")}</div>
    </div>`;
  const field=body.querySelector("#field"), sky=body.querySelector(".sky2"), bcat=body.querySelector("#bcat");
  body.querySelector("#sp").onclick=()=>targets[r]&&speak(targets[r].en);
  const heartSvg=on=>`<svg viewBox="0 0 40 36" class="hrt ${on?"":"off"}"><path d="M20 34 C-6 16 2 -4 20 8 C38 -4 46 16 20 34Z" fill="${on?"url(#gRed)":"#D9D3C7"}" stroke="${on?"#9B1C1C":"#B5AE9F"}" stroke-width="2.5"/></svg>`;
  const drawHearts=()=>{ body.querySelector("#hearts").innerHTML=[0,1,2].map(i=>heartSvg(i<lives)).join(""); };
  const drawCombo=()=>{ body.querySelector("#cfill").style.height=Math.min(100,GAME.streak/8*100)+"%"; };
  const catDo=c=>{ bcat.classList.remove("jump","shock"); void bcat.offsetWidth; bcat.classList.add(c);
    bcat.innerHTML=PIC(c==="shock"?"mascotSad":"mascot"); setTimeout(()=>{ bcat.classList.remove(c); bcat.innerHTML=PIC("mascot"); },900); };
  const burst=(wrap,gold)=>{ const sr=sky.getBoundingClientRect(), br=wrap.querySelector(".balloon2").getBoundingClientRect();
    const cx=br.left-sr.left+br.width/2, cy=br.top-sr.top+br.height/2;
    for(let i=0;i<12;i++){ const a=i/12*Math.PI*2, d=60+Math.random()*50;
      const p=$(`<i class="spark" style="left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;background:${gold?"#FFC83D":colors[i%colors.length]}"></i>`); sky.appendChild(p); setTimeout(()=>p.remove(),700); }
    const pop=$(`<div class="poptxt" style="left:${cx}px;top:${cy}px">POP!</div>`); sky.appendChild(pop); setTimeout(()=>pop.remove(),700);
    const fall=$(`<div class="fallpic" style="left:${cx-34}px;top:${cy-34}px">${wrap.querySelector(".pvb").innerHTML}</div>`); sky.appendChild(fall); setTimeout(()=>fall.remove(),1300); };
  const loseLife=(msg)=>{ lives--; drawHearts(); catDo("shock"); if(msg) tip(msg);
    if(lives<=0){ over=true; field.innerHTML=""; clearTimers(); speechSynthesis.cancel();
      const ov=$(`<div class="bover"><div class="bobox"><div style="width:110px;margin:0 auto">${PIC("mascotSad")}</div><h2 style="justify-content:center">다시 도전!</h2>
        <p class="sub">하트가 모두 없어졌어요</p><div class="btnrow"><button class="big green" id="cont">${ICON("play")} 이어서 하기</button><button class="big alt" id="again">${ICON("refresh")} 처음부터</button></div></div></div>`);

      ov.querySelector("#cont").onclick=()=>{ ov.remove(); lives=3; over=false; drawHearts(); round(); };
      ov.querySelector("#again").onclick=()=>gBalloon(title,key,ic,speedKey);
      return true; }
    return false; };
  function round(){
    field.innerHTML=""; if(over) return;
    if(r>=targets.length) return finish(key,`풍선 ${score}개 한 번에 톡! (${sp.name})`,GAME.pts,score,targets.length);
    setProg(r/targets.length,`남은 풍선 ${targets.length-r}`);
    const t=targets[r]; let tries=0, done=false;
    const n= r>=targets.length-2 ? 5 : 4;
    const opts=shuffle([t,...pick(pool.filter(w=>w.en!==t.en),n-1)]);
    const goldIdx= Math.random()<.3 ? Math.floor(Math.random()*n) : -1;
    const dur=sp.base+Math.max(0,sp.ramp-r*sp.min);
    opts.forEach((o,i)=>{
      const gold=i===goldIdx, scale=(.9+Math.random()*.2).toFixed(2);
      const wrap=$(`<div class="bwrap" style="left:${(1+i*(98/n)).toFixed(1)}%;width:${(98/n).toFixed(1)}%;animation-duration:${(dur+Math.random()*1.2).toFixed(2)}s;animation-delay:${(Math.random()*.6).toFixed(2)}s">
        <button class="balloon2 ${gold?"gold":""}" style="--c:${colors[(i+r)%colors.length]};--sc:${scale};animation-duration:${(2+Math.random()*1.2).toFixed(2)}s"><span class="pvb">${PIC(o.en)}</span><b class="en">${esc(o.en)}</b>${gold?`<span class="gsp">${ICON("sparkle")}</span>`:""}</button><i class="bstr"></i></div>`);
      const btn=wrap.querySelector("button");
      btn.onclick=()=>{ if(done||over||btn.disabled) return;
        if(o.en===t.en){ done=true; burst(wrap,gold); wrap.remove(); beep("pop"); if(!tries) score++;
          const base=(speedKey==="fast"?15:10)*(gold&&!tries?2:1);
          if(!tries){ GAME.streak++; addPts(base+(GAME.streak>=3?5:0), gold?`${ICON("sparkle")} 황금 ×2`:(GAME.streak>=3?`${ICON("fire")} ${GAME.streak}연속!`:"")); beep(GAME.streak>=3?"combo":"good"); }
          else { GAME.streak=0; hudDraw(); beep("good"); }
          if([5,8].includes(GAME.streak)) later(()=>bigPts(0,GAME.streak>=8?"대단해!":"최고야!"),500);
          drawCombo(); catDo("jump"); speak(t.en); r++; later(round,1100); }
        else { tries++; GAME.streak=0; hudDraw(); drawCombo(); noteWrong(t.en); btn.disabled=true; btn.classList.add("bad"); beep("bad"); if(loseLife()) return; } };
      wrap.addEventListener("animationend",ev=>{ if(ev.target!==wrap||over) return; if(o.en===t.en&&!done){ done=true; GAME.streak=0; hudDraw(); drawCombo(); noteWrong(t.en); if(!loseLife(`${ICON("balloon")} 놓쳤어요! 다시 해 봐요`)) later(round,700); } });

/* =========================================================

function gQuiz(title,key,ic){
  const {body,setProg}=frame(title,ic);
  const ws=bookWords(); let order=shuffle(ws); while(order.length<10) order=order.concat(shuffle(ws)); order=order.slice(0,10);
  const qs=order.map((w,i)=>({type:i<3?"listen":"mean",w}));
  let r=0, score=0; GAME.pts=100; hudDraw();
  function round(){
    if(r>=qs.length) return finish(key,`10문제 중 ${score}개 정답!`,GAME.pts,score,qs.length);
    setProg(r/qs.length,`문제 ${r+1} / ${qs.length}`);
    const {type,w}=qs[r]; const opts=shuffle([w,...pick(ws.filter(x=>x.en!==w.en),3)]);
    body.innerHTML=`<p class="sub" style="font-size:21px">${type==="listen"?`${ICON("ear")} 잘 듣고 맞는 단어를 골라요`:`${ICON("book")} 뜻에 맞는 영어 단어를 골라요`}</p>
      ${type==="listen"?`<button class="speaker">${ICON("speaker")}</button>`:`<div class="qsent">${esc(w.ko)}</div>`}
      <div class="opts"></div><p class="sub" style="margin-top:12px">${ICON("warn")} 한 번만 고를 수 있어요! 틀리면 −10점</p>`;
    if(type==="listen"){ body.querySelector(".speaker").onclick=()=>speak(w.en); later(()=>speak(w.en),300); }
    const box=body.querySelector(".opts"); let answered=false;
    opts.forEach(o=>{ const btn=$(`<button class="opt"><span class="en" style="font-size:42px">${esc(o.en)}</span></button>`);
      btn.onclick=()=>{ if(answered) return; answered=true; const ok=o.en===w.en;
        if(ok){ score++; btn.classList.add("right","pop"); GAME.streak++; hudDraw(); beep("good"); cheer(true); }
        else { btn.classList.add("wrong","shake"); addPts(-10); wrong(w.en); [...box.children].forEach((c,i)=>{ if(opts[i].en===w.en) c.classList.add("right"); }); }
        later(()=>speak(w.en),250); r++; later(round, ok?1100:2000); };
      box.appendChild(btn); });
  }
  round();
}

   ⑤ 책 읽기
   ========================================================= */
function storyPages(b){ return b.story.length? b.story : [{en:`${b.blank.before} ${b.blank.answer} ${b.blank.after}`.replace(" .","."), ko:b.blank.ko, art:""}]; }
function gRead(title,key,ic){
  const {body,setProg}=frame(title,ic);
  const b=book(), pages=storyPages(b);
  const vocab={}; b.words.forEach(w=>vocab[w.en.toLowerCase()]=w);
  const gloss=Object.assign({a:"한 개의 / 하나의"},b.gloss||{});
  const lookup=c=> vocab[c]? vocab[c] : (c.endsWith("s")&&vocab[c.slice(0,-1)])? vocab[c.slice(0,-1)] : null;
  let p=0, showKo=false, auto=false; const seenP=new Set();
  function render(){
    const pg=pages[p]; seenP.add(p); setProg((p+1)/pages.length,`${p+1} / ${pages.length} 쪽`);
    const toks=pg.en.split(/\s+/);
    body.innerHTML=`<div class="page">${pg.art?ART(pg.art):""}
      <div class="sent en">${toks.map((t,k)=>{const c=t.toLowerCase().replace(/[^a-z']/g,""); return `<span class="w ${lookup(c)?'vocab':''}" data-c="${c}">${esc(t)}</span>`;}).join(" ")}</div>
      <div class="trans ${showKo?'':'hidden'}">${esc(pg.ko)}</div></div>
      <div class="btnrow"><button class="big alt" id="pv" ${p===0?"disabled":""}>${ICON("left")}</button><button class="big" id="rd">${ICON("speaker")} 읽어주기</button>
        <button class="big pink" id="rs">${ICON("turtle")} 천천히</button><button class="big green" id="tr">${ICON("hangul")} 해석 ${showKo?'숨기기':'보기'}</button>
        <button class="big alt" id="nx">${p===pages.length-1?`다 읽었어요 ${ICON("check")}`:ICON("right")}</button></div>
      ${pages.length>1?`<div class="btnrow" style="margin-top:0"><button class="big purple" id="auto">${auto?`${ICON("stop")} 멈추기`:`${ICON("ff")} 처음부터 끝까지 듣기`}</button></div>`:""}
      <p class="sub">${ICON("bulb")} 밑줄 단어를 누르면 소리와 뜻이 나와요</p>`;
    const spans=[...body.querySelectorAll(".sent .w")];
    spans.forEach(s=>s.onclick=()=>{ const c=s.dataset.c, w=lookup(c); speak(c); if(w) tip(`<span style="width:40px;display:inline-block">${PIC(w.en)}</span> ${esc(w.en)} = ${esc(w.ko)}`); else if(gloss[c]) tip(`${esc(c)} = ${esc(gloss[c])}`); });
    const read=(rate,onDone)=>{
      clearTimers(); spans.forEach(s=>s.classList.remove("hl"));
      const raw= pg.en===pg.en.toUpperCase()? pg.en[0]+pg.en.slice(1).toLowerCase() : pg.en;
      const said=sayText(raw.split(/\s+/).join(" "));
      const starts=[]; let pos=0; said.split(" ").forEach(t=>{starts.push(pos); pos+=t.length+1;});
      let gotB=false; const hl=k=>{ spans.forEach(s=>s.classList.remove("hl")); if(spans[k]) spans[k].classList.add("hl"); };
      let acc=250; toks.forEach((t,k)=>{ later(()=>{ if(!gotB) hl(k); },acc); acc+=(260+t.length*70)/rate*.8; });
      speak(said,{rate,onboundary:e=>{ if(e.name&&e.name!=="word") return; gotB=true; hl(starts.findIndex((s,i)=>e.charIndex>=s&&(i===starts.length-1||e.charIndex<starts[i+1]))); },
        onend:()=>{ later(()=>spans.forEach(s=>s.classList.remove("hl")),300);
          if(showKo) later(()=>speak(pg.ko,{lang:"ko",onend:()=>onDone&&later(onDone,700)}),500); else if(onDone) later(onDone,1200); }});
    };
    const autoNext=()=>{ if(!auto) return; if(p<pages.length-1){ p++; render()(.85,autoNext); } else { auto=false; render(); } };
    body.querySelector("#rd").onclick=()=>read(.85);
    body.querySelector("#rs").onclick=()=>read(.55);
    body.querySelector("#tr").onclick=()=>{ showKo=!showKo; render(); if(showKo) speak(pg.ko,{lang:"ko"}); };
    body.querySelector("#pv").onclick=()=>{ auto=false; if(p>0){ p--; render()(.85); } };
    body.querySelector("#nx").onclick=()=>{ auto=false; if(p<pages.length-1){ p++; const r=render(); later(()=>r(.85),300); } else { addPts(30); finish(key,`${b.title} 읽기 완료!`,GAME.pts); } };
    const ab=body.querySelector("#auto"); if(ab) ab.onclick=()=>{ if(auto){ auto=false; clearTimers(); speechSynthesis.cancel(); render(); } else { auto=true; p=0; render()(.85,autoNext); } };
    return read;
  }
  const read=render(); later(()=>read(.85),500);
}

/* =========================================================
   🏠 숙제 : 복습 녹음 (책 따라 읽고 녹음)
   ========================================================= */
function gRecord(title,key,ic){
  const {body,setProg}=frame(title,ic);
  const b=book(), pages=storyPages(b), recs=pages.map(()=>null);
  let p=0, rec=null, chunks=[], micOk=null, showKo=false, autoStop=null, starting=false, startedAt=0;
  const mime=(()=>{ const c=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"]; try{ return c.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||""; }catch(e){ return ""; } })();
  async function ensureMic(){ if(MIC) return true; if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){ micOk=false; return false; }
    try{ MIC=await navigator.mediaDevices.getUserMedia({audio:true}); micOk=true; return true; }catch(e){ micOk=false; return false; } }
  const recording=()=>rec&&rec.state==="recording";
  function render(){
    const pg=pages[p]; setProg(recs.filter(Boolean).length/pages.length,`${p+1} / ${pages.length} 쪽`);
    const toks=pg.en.split(/\s+/), has=recs[p];
    body.innerHTML=`<div class="page">${pg.art?ART(pg.art):""}<div class="pgno">${has?`${ICON("check")} 녹음 완료`:""}</div>
      <div class="sent en">${toks.map(t=>`<span class="w">${esc(t)}</span>`).join(" ")}</div><div class="trans ${showKo?'':'hidden'}">${esc(pg.ko)}</div></div>
      <div class="btnrow"><button class="big" id="ls">${ICON("speaker")} ① 듣기</button><button class="big pink" id="rc">${ICON("mic")} ② 따라 읽기</button>
        <button class="big green ${has&&has!=="read"?'':'hidden'}" id="pl">${ICON("play")} ③ 내 목소리</button></div>
      <div class="msg" id="mm" style="color:var(--muted)"></div>
      <div class="btnrow"><button class="big alt" id="pv" ${p===0?"disabled":""}>${ICON("left")}</button><button class="big alt" id="tr">${ICON("hangul")} 해석</button>
        <button class="big alt" id="nx" ${has?"":"disabled"}>${p===pages.length-1?`숙제 끝! ${ICON("check")}`:`다음 ${ICON("right")}`}</button></div>
      ${micOk===false?`<div class="notice">${ICON("warn")}<div>마이크를 쓸 수 없어요. 큰 소리로 따라 읽고 아래 버튼을 눌러요.<br><button class="big green" id="rd" style="margin-top:8px">${ICON("check")} 큰 소리로 읽었어요</button></div></div>`:""}`;
    const spans=[...body.querySelectorAll(".sent .w")], mm=body.querySelector("#mm"), rcBtn=body.querySelector("#rc");
    if(recording()){ rcBtn.classList.add("rec"); rcBtn.innerHTML=`${ICON("stop")} 다 읽었으면 눌러요`; mm.innerHTML=`${ICON("recdot")} 녹음 중... 큰 소리로 읽어요!`; }
    const listen=()=>{ clearTimers(); spans.forEach(s=>s.classList.remove("hl"));
      let acc=250; toks.forEach((t,k)=>{ later(()=>{ spans.forEach(s=>s.classList.remove("hl")); spans[k].classList.add("hl"); },acc); acc+=(260+t.length*70); }); later(()=>spans.forEach(s=>s.classList.remove("hl")),acc+300);
      speak(pg.en===pg.en.toUpperCase()? pg.en[0]+pg.en.slice(1).toLowerCase() : pg.en,{rate:.85}); };
    body.querySelector("#ls").onclick=listen;
    rcBtn.onclick=async()=>{
      if(recording()){ if(Date.now()-startedAt<800) return; rec.stop(); return; }
      if(starting) return; starting=true; speechSynthesis.cancel(); clearTimers(); mm.textContent="마이크 준비 중...";
      if(!(await ensureMic())){ starting=false; render(); return; }
      chunks=[]; try{ rec= mime? new MediaRecorder(MIC,{mimeType:mime}) : new MediaRecorder(MIC); }catch(e){ starting=false; micOk=false; render(); return; }
      rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{ clearTimeout(autoStop); if(recs[p]&&recs[p]!=="read") URL.revokeObjectURL(recs[p]);
        const first=!recs[p]; recs[p]=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||mime||"audio/webm"})); if(first) addPts(10); beep("good"); render(); body.querySelector("#mm").textContent="잘했어요! 내 목소리를 들어 봐요"; };
      rec.start(); startedAt=Date.now(); starting=false; rcBtn.classList.add("rec"); rcBtn.innerHTML=`${ICON("stop")} 다 읽었으면 눌러요`; mm.innerHTML=`${ICON("recdot")} 녹음 중... 큰 소리로 읽어요!`;
      autoStop=setTimeout(()=>{ if(recording()) rec.stop(); },20000);
    };
    const pl=body.querySelector("#pl"); if(pl) pl.onclick=()=>{ speechSynthesis.cancel(); new Audio(recs[p]).play().catch(()=>{}); };
    const rd=body.querySelector("#rd"); if(rd) rd.onclick=()=>{ if(!recs[p]) addPts(10); recs[p]="read"; beep("good"); render(); };
    body.querySelector("#tr").onclick=()=>{ showKo=!showKo; render(); };
    body.querySelector("#pv").onclick=()=>{ if(recording()) return; if(p>0){ p--; render(); } };
    body.querySelector("#nx").onclick=()=>{ if(!recs[p]||recording()) return;
      if(p<pages.length-1){ p++; render(); later(listen,400); } else { stopMic(); const n=recs.filter(Boolean).length; finish(key,`${b.title} 복습 녹음 숙제 완료!`,GAME.pts,n,pages.length); } };
  }
  render(); later(()=>{ const l=body.querySelector("#ls"); l&&l.click(); },500);
}

/* =========================================================
   🏠 숙제 : 철자 블록
   ========================================================= */
function gSpell(title,key,ic){
  const {body,setProg}=frame(title,ic);
  const ws=shuffle(bookWords().filter(w=>w.en.replace(/ /g,"").length>1)); let r=0, perfect=0;
  function round(){
    if(r>=ws.length) return finish(key,`철자 블록 완성! (${perfect}개 한 번에)`,GAME.pts,perfect,ws.length);
    setProg(r/ws.length,`남은 단어 ${ws.length-r}`);
    const w=ws[r], letters=[...w.en]; let pos=0, miss=0, hints=0;
    const extra=pick([..."abcdefghijklmnopqrstuvwxyz"].filter(c=>!w.en.includes(c)),2);
    const tiles=shuffle(letters.filter(c=>c!==" ").concat(extra));
    body.innerHTML=`<div class="spell-top">${pv(w)}<div class="ko">${esc(w.ko)}</div><div class="btnrow" style="margin:8px 0"><button class="big" id="sp">${ICON("speaker")} 다시 듣기</button><button class="big alt" id="hint">${ICON("bulb")} 힌트 <small style="font-size:14px;color:#d63c3c">−3점</small></button></div></div>
      <div class="hintwrap"><div class="hintline en" id="hl">${esc(w.en)}</div><div class="slots"></div></div><div class="tiles"></div>`;
    body.querySelector("#sp").onclick=()=>speak(w.en,{rate:.6});
    body.querySelector("#hint").onclick=()=>{ const h=body.querySelector("#hl"); if(h.classList.contains("show")) return; hints++; addPts(-3,"힌트"); h.classList.add("show"); speak(w.en,{rate:.6}); later(()=>h.classList.remove("show"),2000); };
    const slots=body.querySelector(".slots"), tl=body.querySelector(".tiles");
    letters.forEach(c=>slots.appendChild($(`<div class="slot en ${c===" "?"space":""}"></div>`)));
    const skip=()=>{ while(letters[pos]===" ") pos++; }; skip();
    tiles.forEach(c=>{ const b=$(`<button class="tile en">${c}</button>`);
      b.onclick=()=>{ if(c===letters[pos]){ const s=slots.children[pos]; s.textContent=c; s.classList.add("fill","pop"); b.classList.add("used"); beep("pop"); pos++; skip();
          if(pos>=letters.length){ if(!miss&&!hints){ perfect++; right(true,12); } else { addPts(6); right(false); } speak(w.en); r++; later(round,1300); } }
        else { miss++; noteWrong(w.en); GAME.streak=0; hudDraw(); b.classList.add("shake"); beep("bad"); later(()=>b.classList.remove("shake"),400); } };
      tl.appendChild(b); });
    later(()=>speak(w.en,{rate:.6}),300);
  }
  round();
}

/* =========================================================
   ⑥ 학원 : 문장 블록 맞추기 (5문장, 힌트 있음)
   ========================================================= */
function gBuild(title,key,ic){
  const {body,setProg}=frame(title,ic);
  const b=book(), pages=storyPages(b).filter(p=>p.en.split(/\s+/).length>=2);
  const sorted=pages.slice().sort((x,y)=>x.en.length-y.en.length);
  let chosen=[]; const n=Math.min(5,sorted.length); for(let i=0;i<n;i++) chosen.push(sorted[Math.round(i*(sorted.length-1)/Math.max(1,n-1))]);
  chosen=[...new Set(chosen)];
  let r=0, perfect=0;
  function round(){
    if(r>=chosen.length) return finish(key,`문장 ${chosen.length}개 완성! (${perfect}개 한 번에)`,GAME.pts,perfect,chosen.length);
    setProg(r/chosen.length,`남은 문장 ${chosen.length-r}`);
    const pg=chosen[r];
    const toks=pg.en.split(/\s+/).map(t=>{ const m=t.match(/^(.*?)([.,!?]*)$/); return {w:m[1],p:m[2]}; });
    let pos=0, miss=0, hints=0;
    body.innerHTML=`<div class="build-art">${pg.art?ART(pg.art):""}</div><div class="build-ko">${esc(pg.ko)}</div>
      <div class="btnrow" style="margin:6px 0"><button class="big" id="sp">${ICON("speaker")} 문장 듣기</button><button class="big alt" id="hint">${ICON("bulb")} 힌트 <small style="font-size:14px;color:#d63c3c">−3점</small></button></div>
      <div class="hintwrap"><div class="hintline en" id="hl">${esc(pg.en)}</div><div class="slots words">${toks.map(()=>`<div class="slot en"></div>`).join("")}</div></div><div class="tiles words"></div>`;
    body.querySelector("#hint").onclick=()=>{ const h=body.querySelector("#hl"); if(h.classList.contains("show")) return; hints++; addPts(-3,"힌트"); h.classList.add("show"); body.querySelector("#sp").click(); later(()=>h.classList.remove("show"),2000); };
    body.querySelector("#sp").onclick=()=>speak(pg.en===pg.en.toUpperCase()? pg.en[0]+pg.en.slice(1).toLowerCase() : pg.en,{rate:.8});
    const slots=[...body.querySelectorAll(".slot")], tl=body.querySelector(".tiles");
    shuffle(toks.map((t,i)=>({...t,i}))).forEach(t=>{ const btn=$(`<button class="tile en">${esc(t.w)}</button>`);
      btn.onclick=()=>{ const need=toks[pos];
        if(t.w===need.w){ slots[pos].textContent=need.w+need.p; slots[pos].classList.add("fill","pop"); btn.classList.add("used"); beep("pop"); speak(need.w); pos++;
          if(pos>=toks.length){ const got=Math.max(5,20-5*miss); if(!miss&&!hints) perfect++; GAME.streak=miss?0:GAME.streak+1; addPts(got); cheer(true); beep("good");
            later(()=>speak(pg.en===pg.en.toUpperCase()? pg.en[0]+pg.en.slice(1).toLowerCase() : pg.en,{rate:.85}),400); r++; later(round,2800); } }
        else { miss++; noteWrong(need.w); GAME.streak=0; hudDraw(); btn.classList.add("shake"); beep("bad"); later(()=>btn.classList.remove("shake"),400); } };
      tl.appendChild(btn); });
    later(()=>body.querySelector("#sp").click(),400);
  }
  round();
}

const pctCell=v=> v===null?"-":`<b class="${v>=80?'score-hi':v<60?'score-lo':''}">${v}%</b>`;
const bestSum=rs=>{ const m={}; rs.forEach(r=>{ if(r.key) m[r.key]=Math.max(m[r.key]||0,r.stars||0); }); return Object.values(m).reduce((a,b)=>a+b,0); };
function showDashboard(selCls){
  resetScreen(); document.getElementById("brand").textContent="선생님 모드";
  const {students,records}=TEACHER.data;
  const classes=[...new Set(students.map(s=>s.cls).concat(records.map(r=>r.cls)))];
  if(!selCls||!classes.includes(selCls)) selCls=classes[0]||"";
  const el=$(`<section><div class="trow" style="margin:6px 0 14px"><b style="font-size:20px">반</b><select id="cs">${classes.map(c=>`<option ${c===selCls?'selected':''}>${esc(c)}</option>`).join("")}</select>
      <button class="big alt" id="rf" style="font-size:16px;padding:8px 12px">${ICON("refresh")} 새로고침</button><button class="big alt" id="ex" style="font-size:16px;padding:8px 12px">${ICON("door")} 나가기</button></div>
    <div class="panel"><h3>${ICON("board")} 반 현황 <small style="font-size:14px;color:#7a7a8c">(이름을 누르면 자세히 보여요)</small></h3><div class="tblwrap" id="sum"></div></div>
    <div class="panel"><h3>${ICON("alert")} 우리 반이 자주 틀린 단어</h3><div class="chips" id="ww"></div></div>
    <div class="panel"><h3>${ICON("plus")} 학생 추가</h3><div class="trow"><input id="nc" placeholder="반" value="${esc(selCls||"LEVEL P")}"><input id="nn" placeholder="이름"><input id="np" placeholder="번호 4자리 (kelly 뒤 숫자)" maxlength="4" inputmode="numeric">
      <button class="big green" id="add" style="font-size:16px;padding:8px 14px">추가</button></div><div class="msg" id="am" style="text-align:left"></div></div></section>`);
  app.appendChild(el);
  el.querySelector("#cs").onchange=e=>showDashboard(e.target.value);
  el.querySelector("#rf").onclick=()=>reloadDashboard(selCls);
  el.querySelector("#ex").onclick=()=>{ TEACHER=null; showLogin(); };
  const recs=records.filter(r=>r.cls===selCls);
  const names=[...new Set(students.filter(s=>s.cls===selCls).map(s=>s.name).concat(recs.map(r=>r.name)))];
  const rows=names.map(n=>{ const rs=recs.filter(r=>r.name===n), st=students.find(s=>s.cls===selCls&&s.name===n);
    const scored=rs.filter(r=>r.total), quiz=rs.filter(r=>r.mission==="quiz"&&r.total), last=rs.reduce((a,r)=>!a||r.time>a.time?r:a,null);
    return {n, id:st?`kelly${st.pin}`:"(삭제됨)", last, pts:bestSum(rs), done:new Set(rs.map(r=>r.key)).size,
      acc:pct(scored.reduce((a,r)=>a+r.score,0),scored.reduce((a,r)=>a+r.total,0)), quiz:pct(quiz.reduce((a,r)=>a+r.score,0),quiz.reduce((a,r)=>a+r.total,0)), mins:Math.round(rs.reduce((a,r)=>a+r.seconds,0)/60)}; })
    .sort((a,b)=>b.pts-a.pts);
  el.querySelector("#sum").innerHTML= rows.length? `<table class="tbl"><tr><th>이름</th><th>아이디</th><th>점수</th><th>등급</th><th>끝낸 미션</th><th>확인 퀴즈</th><th>전체 정답률</th><th>마지막 학습</th><th>최근 책</th><th>학습 시간</th></tr>
    ${rows.map(r=>`<tr class="click" data-n="${esc(r.n)}"><td><b>${esc(r.n)}</b></td><td class="en">${esc(r.id)}</td><td><b>${r.pts}</b></td><td>${rankOf(r.pts).name}</td><td>${r.done}</td><td>${pctCell(r.quiz)}</td><td>${pctCell(r.acc)}</td><td>${r.last?fmtTime(r.last.time):"-"}</td><td>${r.last?`K${esc(r.last.setId)} ${esc(r.last.bookTitle)}`:"-"}</td><td>${r.mins}분</td></tr>`).join("")}</table>` : `<p class="sub">이 반에는 아직 학생이 없어요.</p>`;
  el.querySelectorAll("#sum tr.click").forEach(tr=>tr.onclick=()=>showStudent(selCls,tr.dataset.n));
  const cnt={}; recs.forEach(r=>r.wrong.split(",").map(x=>x.trim()).filter(Boolean).forEach(w=>cnt[w]=(cnt[w]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,15);
  el.querySelector("#ww").innerHTML= top.length? top.map(([w,c])=>`<span class="en">${esc(w)} · ${c}번</span>`).join("") : `<span style="background:#E3FFF0">아직 없어요</span>`;
  el.querySelector("#add").onclick=async()=>{ const cls=el.querySelector("#nc").value.trim(), name=el.querySelector("#nn").value.trim(), pin=el.querySelector("#np").value.trim(), m=el.querySelector("#am");
    if(!cls||!name||!/^\d{4}$/.test(pin)){ m.textContent="반, 이름, 번호 4자리를 모두 넣어 주세요"; return; }
    m.style.color="var(--muted)"; m.textContent="추가하는 중...";
    try{ const res=await api({action:"addStudent",pw:TEACHER.pw,cls,name,pin}); if(res.ok){ tip(`${esc(name)} 추가 완료! (아이디 kelly${pin})`); reloadDashboard(cls); } else { m.style.color=""; m.textContent=res.error||"추가하지 못했어요"; } }
    catch(e){ m.style.color=""; m.textContent="인터넷 연결을 확인해 주세요"; } };
}
function showStudent(cls,name){
  resetScreen(); document.getElementById("brand").textContent=`${cls} · ${name}`;
  const rs=TEACHER.data.records.filter(r=>r.cls===cls&&r.name===name).sort((a,b)=>a.time<b.time?1:-1);
  const sets=[...new Set(rs.map(r=>r.setId))], doneKeys=new Set(rs.map(r=>r.key));
  const el=$(`<section><div class="trow" style="margin:6px 0 14px"><button class="big alt" id="bk" style="font-size:16px;padding:8px 12px">${ICON("left")} 반 현황</button><h2 style="margin:0">${esc(name)} 학습 기록 · ${bestSum(rs)}점</h2></div>
    <div class="panel"><h3>${ICON("book")} 책별 진도</h3><div id="pg"></div></div><div class="panel"><h3>${ICON("clock")} 전체 기록</h3><div class="tblwrap" id="hist"></div></div>
    <div class="panel"><h3>${ICON("teacher")} 학생 관리</h3><button class="big alt" id="del" style="font-size:16px;padding:8px 12px;color:#d63c3c">이 학생을 명단에서 삭제</button> <span style="color:#7a7a8c;font-size:14px">예전 기록은 시트에 남아요.</span></div></section>`);
  app.appendChild(el); el.querySelector("#bk").onclick=()=>showDashboard(cls);
  el.querySelector("#pg").innerHTML= sets.length? sets.map(id=>{ const set=BOOK_SETS[id];
    const head=`<tr><th>K${esc(id)}</th>${MISSIONS.map(m=>`<th>${m.group==="home"?"숙제 · ":""}${m.name}</th>`).join("")}</tr>`;
    const body=(set?set.books:[]).map((b,i)=>`<tr><td><b class="en">${esc(b.title)}</b></td>${MISSIONS.map(m=>{ const k=`${id}-${i}-${m.id}`, best=Math.max(0,...rs.filter(r=>r.key===k).map(r=>r.stars||0)); return `<td>${doneKeys.has(k)?`${ICON("check")}<br><small>${best}점</small>`:"-"}</td>`; }).join("")}</tr>`).join("");
    return `<div style="overflow:auto;margin-bottom:12px"><table class="grid-prog">${head}${body}</table></div>`; }).join("") : `<p class="sub">아직 기록이 없어요.</p>`;
  el.querySelector("#hist").innerHTML= rs.length? `<table class="tbl"><tr><th>날짜</th><th>책</th><th>미션</th><th>맞힘</th><th>점수</th><th>시간</th><th>틀린/힌트 단어</th></tr>
    ${rs.map(r=>`<tr><td>${fmtTime(r.time)}</td><td>K${esc(r.setId)} ${esc(r.bookTitle)}</td><td>${esc(r.missionName)}</td><td>${r.total?`${r.score}/${r.total} ${pctCell(pct(r.score,r.total))}`:"-"}</td><td>${r.stars}</td><td>${Math.max(1,Math.round(r.seconds/60))}분</td><td class="en" style="font-weight:600">${esc(r.wrong)||"-"}</td></tr>`).join("")}</table>` : "";
  el.querySelector("#del").onclick=async()=>{ if(!confirm(`${name} 학생을 명단에서 삭제할까요? (기록은 남아요)`)) return;
    try{ const res=await api({action:"deleteStudent",pw:TEACHER.pw,cls,name}); if(res.ok){ tip("삭제했어요"); reloadDashboard(cls); } else tip(esc(res.error||"삭제 실패")); }catch(e){ tip("인터넷 연결을 확인해 주세요"); } };
}

/* ---------- 시작 ---------- */
document.getElementById("homeBtn").onclick=()=> USER? showHome() : showLogin();
document.getElementById("logoutBtn").onclick=()=>{ flushQueue(); setUser(null); showLogin(); };
document.getElementById("soundBtn").innerHTML=ICON("speaker");
document.getElementById("homeBtn").innerHTML=ICON("home");
document.getElementById("logoutBtn").innerHTML=ICON("door");
drawVoiceBtn();
(function start(){
  let sess=null; try{ sess=JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){}
  if(sess&&Date.now()-sess.at<3*60*60*1000&&(sess.guest||SCRIPT_URL)){ const {at,...u}=sess; setUser(u); } else setUser(null);
  flushQueue();
  const h=location.hash.replace("#","");
  if(!USER) showLogin(); else if(BOOK_SETS[h]) openSet(h,0); else showHome();
})();

</script>
</body>
